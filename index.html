<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="4; url=https://kingfarooq.github.io/portfolio/" />
  <link rel="icon" href="kingfarooq logo.png" type="image/x-icon">
  <title>Redirecting to Portfolio | Farooq Anwar</title>

  <!-- Google Fonts (matches portfolio) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    :root {
      --black:#050708; --panel:#0b1113; --panel-2:#10191b; --white:#edf7f4;
      --muted:#8aa29f; --line:rgba(157,224,213,.18); --green:#9dffd3;
      --cyan:#48e8ff; --blue:#4d7cff; --lime:#d2ff55; --glow:0 0 35px rgba(72,232,255,.18);
      --mono:'DM Mono', monospace; --sans:'Space Grotesk', sans-serif;
      --radius: 16px;
      --transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      font-size: 100%;
      scroll-behavior: smooth;
      background: var(--black);
    }

    body {
      background: radial-gradient(circle at 68% 48%, rgba(0,116,153,.14), transparent 32%), linear-gradient(135deg, var(--black) 0%, #071012 100%);
      color: var(--white);
      font-family: var(--sans);
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      opacity: 1;
      transition: opacity 0.8s ease;
      position: relative;
      line-height: 1.6;
      padding: 1rem;
    }

    body.fade-out {
      opacity: 0;
    }

    /* Background elements - matches portfolio hero grid */
    .grid-lines{
      position:fixed;
      inset:0;
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 2.5rem 2.5rem;
      opacity: .35;
      z-index:-2;
      pointer-events:none;
      animation: gridMove 20s linear infinite;
    }

    @keyframes gridMove {
      0% { transform: translate(0, 0); }
      100% { transform: translate(2.5rem, 2.5rem); }
    }

    .floating-icons{
      position:fixed;
      inset:0;
      z-index:-1;
      pointer-events:none;
    }

    .floating-icon{
      position:absolute;
      color: rgba(157,255,211,0.1);
      font-size:1.4rem;
      animation: floatLinear 14s infinite linear;
      filter: drop-shadow(0 0 5px rgba(72, 232, 255, 0.25));
    }

    @keyframes floatLinear {
      0%{ transform: translateY(10vh) rotate(0deg); opacity:0; }
      10%{ opacity:1; }
      100%{ transform: translateY(-120vh) rotate(360deg); opacity:0; }
    }

    /* Pulsing background effect */
    .pulse-bg {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100vmax;
      height: 100vmax;
      background: radial-gradient(circle, rgba(72,232,255,0.06) 0%, transparent 70%);
      z-index: -3;
      animation: pulse 8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.3; }
      50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.6; }
    }

    /* Main content container */
    .redirect-container {
      text-align: center;
      position: relative;
      z-index: 10;
      padding: clamp(1.5rem, 5vw, 3rem);
      background: linear-gradient(145deg, rgba(16,25,27,.92), rgba(7,12,14,.92));
      border-radius: var(--radius);
      border: 1px solid var(--line);
      backdrop-filter: blur(12px);
      max-width: 90vw;
      width: 480px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4),
                 0 0 0 1px rgba(157,255,211,0.06);
      margin: 0 auto;
      transform: translateY(0);
      transition: var(--transition);
    }

    .redirect-container:hover {
      border-color: var(--cyan);
      box-shadow: 0 20px 40px rgba(0,0,0,0.5), var(--glow);
      transform: translateY(-5px);
    }

    .kicker {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--green);
      font: 11px var(--mono);
      letter-spacing: .13em;
      text-transform: uppercase;
      margin-bottom: clamp(1.2rem, 3vw, 1.8rem);
    }
    .kicker:before, .kicker:after {
      content: "";
      width: 24px;
      height: 1px;
      background: var(--green);
    }

    .glitch-container {
      position: relative;
      display: inline-block;
      margin: 0 auto clamp(1.5rem, 4vw, 2rem);
    }

    h1 {
      font-family: var(--sans);
      font-weight: 700;
      font-size: clamp(1.8rem, 8vw, 3.2rem);
      letter-spacing: -.03em;
      text-transform: uppercase;
      color: transparent;
      -webkit-text-stroke: 1px var(--cyan);
      text-shadow: 0 0 25px rgba(72,232,255,.18);
      position: relative;
      margin: 0;
      animation: glitch-skew 4s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite;
    }

    h1::before,
    h1::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      color: var(--green);
      -webkit-text-stroke: 0;
      opacity: 0.55;
    }

    h1::before {
      animation: glitch-anim 5s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite alternate-reverse;
      left: 2px;
      clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%);
    }

    h1::after {
      animation: glitch-anim2 4s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite alternate-reverse;
      left: -2px;
      color: var(--lime);
      clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%);
    }

    @keyframes glitch-anim {
      0% { transform: translate(0); }
      20% { transform: translate(-2px, 2px); }
      40% { transform: translate(-2px, -2px); }
      60% { transform: translate(2px, 2px); }
      80% { transform: translate(2px, -2px); }
      100% { transform: translate(0); }
    }

    @keyframes glitch-anim2 {
      0% { transform: translate(0); }
      20% { transform: translate(2px, -2px); }
      40% { transform: translate(2px, 2px); }
      60% { transform: translate(-2px, -2px); }
      80% { transform: translate(-2px, 2px); }
      100% { transform: translate(0); }
    }

    @keyframes glitch-skew {
      0% { transform: skew(0deg); }
      5% { transform: skew(2deg); }
      10% { transform: skew(-2deg); }
      15% { transform: skew(0deg); }
      50% { transform: skew(0deg); }
      55% { transform: skew(1deg); }
      60% { transform: skew(-1deg); }
      65% { transform: skew(0deg); }
      100% { transform: skew(0deg); }
    }

    p {
      font-size: clamp(1rem, 4vw, 1.15rem);
      margin-bottom: clamp(1.5rem, 4vw, 2rem);
      color: var(--muted);
      line-height: 1.6;
      font-weight: 400;
    }

    /* Progress bar */
    .progress-container {
      width: 100%;
      height: 6px;
      background: rgba(157,224,213,.08);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: clamp(1.5rem, 4vw, 2rem);
      position: relative;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.3);
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--green), var(--cyan), var(--blue));
      border-radius: 4px;
      animation: progress 4s linear forwards;
      box-shadow: 0 0 14px rgba(72,232,255,.5);
      position: relative;
      overflow: hidden;
    }

    .progress-bar::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      animation: shimmer 2s infinite;
    }

    @keyframes progress {
      0% { width: 0%; }
      100% { width: 100%; }
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    /* Link button - matches portfolio .btn.primary */
    .redirect-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: clamp(0.8rem, 2.5vw, 1rem) clamp(1.5rem, 4vw, 2rem);
      background: var(--green);
      color: var(--black);
      border-radius: 4px;
      text-decoration: none;
      font: 11px var(--mono);
      letter-spacing: .1em;
      text-transform: uppercase;
      font-weight: 500;
      transition: var(--transition);
      border: 1px solid var(--green);
      min-height: 50px;
      min-width: 50px;
      position: relative;
      overflow: hidden;
      touch-action: manipulation;
    }

    .redirect-link::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0,0,0,0.15), transparent);
      transition: left 0.5s;
    }

    .redirect-link:hover, .redirect-link:active {
      transform: translateY(-3px);
      box-shadow: var(--glow);
    }

    .redirect-link:hover::before, .redirect-link:active::before {
      left: 100%;
    }

    /* Loading dots animation */
    .dots::after {
      content: '';
      animation: dots 1.5s steps(3, end) infinite;
    }

    @keyframes dots {
      0% { content: ''; }
      33% { content: '.'; }
      66% { content: '..'; }
      100% { content: '...'; }
    }

    /* Custom cursor - disabled on touch devices */
    .cursor, .cursor-follower{
      position:fixed;
      left:0;
      top:0;
      pointer-events:none;
      z-index:9999;
      transform:translate(-50%,-50%);
      transition:transform .08s linear;
      mix-blend-mode: difference;
    }
    @media (hover: hover) and (pointer: fine) {
      .cursor{
        width:16px;
        height:16px;
        border-radius:50%;
        background: rgba(157,255,211,0.9);
        box-shadow:0 0 12px rgba(157,255,211,0.9);
        transition: transform 0.1s, width 0.3s, height 0.3s;
      }
      .cursor-follower{
        width:36px;
        height:36px;
        border-radius:50%;
        border:1px solid rgba(72,232,255,0.5);
        transition: transform 0.15s, width 0.3s, height 0.3s;
      }
    }
    @media (hover: none) {
      .cursor, .cursor-follower { display: none; }
    }

    /* Logo/brand element */
    .brand {
      position: absolute;
      top: 1.5rem;
      left: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font: 11px var(--mono);
      letter-spacing: .12em;
      text-transform: uppercase;
      font-weight: 500;
      color: var(--green);
      text-shadow: 0 0 10px rgba(157,255,211,0.35);
      z-index: 20;
    }

    .brand-mark{
      display:grid;
      place-items:center;
      width:26px;
      height:26px;
      border:1px solid var(--green);
      border-radius:50%;
      color:var(--black);
      background:var(--green);
      font:10px var(--mono);
      box-shadow:0 0 18px rgba(157,255,211,.35);
    }

    /* Mobile-specific optimizations */
    @media (max-width: 768px) {
      body {
        padding: 0.8rem;
        justify-content: flex-start;
        padding-top: min(15vh, 5rem);
      }

      .redirect-container {
        padding: clamp(1.5rem, 4vw, 2rem);
        max-width: 95vw;
      }

      .floating-icon {
        font-size: 1.2rem;
      }

      .brand {
        position: relative;
        top: auto;
        left: auto;
        margin-bottom: 1.5rem;
        font-size: 1.1rem;
      }

      h1::before, h1::after {
        opacity: 0.4;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 0.5rem;
        padding-top: min(10vh, 4rem);
      }

      .redirect-container {
        padding: 1.5rem;
        max-width: 98vw;
      }

      .redirect-link {
        width: 100%;
        max-width: 280px;
        padding: 1rem 1.5rem;
      }

      .floating-icon {
        font-size: 1rem;
        opacity: 0.06;
      }

      .brand {
        margin-bottom: 1rem;
      }

      .grid-lines {
        animation-duration: 30s;
      }

      .pulse-bg {
        animation-duration: 12s;
      }
    }

    /* Orientation adjustment for mobile */
    @media (max-height: 500px) and (orientation: landscape) {
      body {
        padding-top: 1rem;
        padding-bottom: 1rem;
        justify-content: flex-start;
        min-height: auto;
      }

      .redirect-container {
        padding: 1.5rem;
        max-width: 90%;
      }

      h1 {
        font-size: clamp(1.8rem, 6vw, 2.5rem);
        margin-bottom: 1rem;
      }

      p {
        margin-bottom: 1rem;
        font-size: 1rem;
      }

      .brand {
        position: relative;
        top: auto;
        left: auto;
        margin-bottom: 1rem;
      }

      .floating-icons {
        display: none;
      }
    }

    /* Very small devices */
    @media (max-width: 320px) {
      .redirect-container {
        padding: 1.2rem;
      }

      h1 {
        font-size: 1.6rem;
      }

      .redirect-link {
        padding: 0.9rem 1.2rem;
        font-size: 0.9rem;
      }

      p {
        font-size: 0.95rem;
      }
    }

    /* High resolution displays */
    @media (min-resolution: 192dpi) {
      .grid-lines {
        background-size: 2rem 2rem;
      }
    }

    /* Reduced motion support */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }

      .progress-bar {
        animation: none;
        width: 100%;
      }

      .floating-icon {
        animation: none;
        opacity: 0.05;
      }

      .grid-lines {
        animation: none;
      }

      .pulse-bg {
        animation: none;
      }

      h1::before, h1::after {
        display: none;
      }
    }

    /* Touch device optimizations */
    @media (hover: none) {
      .redirect-link:hover {
        transform: none;
        box-shadow: none;
      }

      .redirect-container:hover {
        transform: none;
        box-shadow: 0 15px 35px rgba(0,0,0,0.4),
                    0 0 0 1px rgba(157,255,211,0.06);
      }
    }
  </style>

  <script>
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

    setTimeout(() => {
      document.body.classList.add('fade-out');
    }, 3500);

    document.addEventListener('DOMContentLoaded', function() {
      if (window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
        const cursor = document.querySelector('.cursor');
        const follower = document.querySelector('.cursor-follower');
        let mouseX = window.innerWidth/2, mouseY = window.innerHeight/2;
        let posX = mouseX, posY = mouseY;

        document.addEventListener('mousemove', (e) => {
          mouseX = e.clientX;
          mouseY = e.clientY;
          cursor.style.transform = `translate3d(${mouseX}px, ${mouseY}px, 0)`;
        });

        function animateFollower(){
          posX += (mouseX - posX) * 0.12;
          posY += (mouseY - posY) * 0.12;
          follower.style.transform = `translate3d(${posX}px, ${posY}px, 0)`;
          requestAnimationFrame(animateFollower);
        }
        requestAnimationFrame(animateFollower);

        const interactive = 'a, button, .redirect-link';
        document.querySelectorAll(interactive).forEach(el=>{
          el.addEventListener('mouseenter', () => {
            cursor.style.width = '12px';
            cursor.style.height = '12px';
            follower.style.width = '45px';
            follower.style.height = '45px';
          });
          el.addEventListener('mouseleave', () => {
            cursor.style.width = '16px';
            cursor.style.height = '16px';
            follower.style.width = '36px';
            follower.style.height = '36px';
          });
        });
      }

      document.querySelectorAll('.floating-icon').forEach((el, idx) => {
        const base = 12 + (idx % 3) * 3;
        el.style.animationDuration = `${base}s`;
        el.style.opacity = isMobile ? '0.06' : '0.1';
      });

      if (isMobile) {
        document.querySelectorAll('.floating-icon').forEach(el => {
          el.style.animationDuration = '20s';
        });
        document.querySelector('.grid-lines').style.animationDuration = '30s';
      }
    });
  </script>
</head>
<body>
  <!-- Custom cursor elements - hidden on touch devices -->
  <div class="cursor" aria-hidden="true"></div>
  <div class="cursor-follower" aria-hidden="true"></div>

  <!-- Background elements to match portfolio -->
  <div class="grid-lines" aria-hidden="true"></div>
  <div class="pulse-bg" aria-hidden="true"></div>

  <div class="floating-icons" aria-hidden="true">
    <i class="floating-icon fas fa-code" style="top:10%; left:20%; animation-delay:0s;"></i>
    <i class="floating-icon fas fa-laptop-code" style="top:30%; left:80%; animation-delay:2s;"></i>
    <i class="floating-icon fas fa-microchip" style="top:70%; left:10%; animation-delay:4s;"></i>
    <i class="floating-icon fas fa-server" style="top:50%; left:90%; animation-delay:6s;"></i>
    <i class="floating-icon fas fa-terminal" style="top:80%; left:70%; animation-delay:8s;"></i>
    <i class="floating-icon fas fa-database" style="top:20%; left:50%; animation-delay:10s;"></i>
    <i class="floating-icon fas fa-cube" style="top:60%; left:30%; animation-delay:1s;"></i>
    <i class="floating-icon fas fa-network-wired" style="top:40%; left:60%; animation-delay:7s;"></i>
  </div>

  <!-- Brand element -->
  <div class="brand">
    <span class="brand-mark">F/</span>
    <span>Farooq Anwar</span>
  </div>

  <div class="redirect-container">
    <div class="kicker">Signal Redirect</div>
    <div class="glitch-container">
      <h1 data-text="Redirecting">Redirecting<span class="dots"></span></h1>
    </div>

    <div class="progress-container">
      <div class="progress-bar"></div>
    </div>

    <p>Taking you to my digital portfolio<br />Please wait a moment...</p>

    <a href="https://kingfarooq.github.io/portfolio/" class="redirect-link">
      <i class="fas fa-external-link-alt"></i> Click here if not redirected
    </a>
  </div>
</body>
</html>
