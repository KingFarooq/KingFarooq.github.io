<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="4; url=https://kingfarooq.github.io/portfolio/" />
  <link rel="icon" href="kingfarooq logo.png" type="image/x-icon">
  <title>Redirecting to Portfolio | King Farooq</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --primary: #00f7ff;
      --secondary: #ff00aa;
      --accent: #9d4edd;
      --dark: #0a0a14;
      --darker: #05050a;
      --light: #e6eef2;
      --neon-glow: 0 0 10px rgba(0,247,255,0.8),
                   0 0 20px rgba(0,247,255,0.6),
                   0 0 30px rgba(0,247,255,0.35);
      --neon-glow-pink: 0 0 10px rgba(255,0,170,0.8),
                        0 0 20px rgba(255,0,170,0.6),
                        0 0 30px rgba(255,0,170,0.35);
      --font-main: 'Orbitron', sans-serif;
      --font-secondary: 'Rajdhani', sans-serif;
      --radius: 16px;
      --transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      font-size: 100%;
      scroll-behavior: smooth;
    }

    body {
      background: linear-gradient(135deg, var(--darker) 0%, var(--dark) 100%);
      color: var(--light);
      font-family: var(--font-secondary);
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh; /* Dynamic viewport height for mobile */
      opacity: 1;
      transition: opacity 0.8s ease;
      position: relative;
      line-height: 1.6;
      padding: 1rem;
    }

    body.fade-out {
      opacity: 0;
    }

    /* Enhanced background elements - optimized for mobile */
    .grid-lines{
      position:fixed;
      inset:0;
      background-image:
        linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 2.5rem 2.5rem;
      z-index:-2;
      pointer-events:none;
      animation: gridMove 20s linear infinite;
    }
    
    @keyframes gridMove {
      0% { transform: translate(0, 0); }
      100% { transform: translate(2.5rem, 2.5rem); }
    }
    
    .floating-icons{ 
      position:fixed; 
      inset:0; 
      z-index:-1; 
      pointer-events:none; 
    }
    
    .floating-icon{
      position:absolute; 
      color:rgba(255,255,255,0.08); 
      font-size:1.4rem; 
      animation: floatLinear 14s infinite linear;
      filter: drop-shadow(0 0 5px rgba(0, 247, 255, 0.3));
    }
    
    @keyframes floatLinear {
      0%{ transform: translateY(10vh) rotate(0deg); opacity:0; }
      10%{ opacity:1; }
      100%{ transform: translateY(-120vh) rotate(360deg); opacity:0; }
    }

    /* Pulsing background effect */
    .pulse-bg {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100vmax;
      height: 100vmax;
      background: radial-gradient(circle, rgba(0, 247, 255, 0.05) 0%, transparent 70%);
      z-index: -3;
      animation: pulse 8s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.3; }
      50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.6; }
    }

    /* Main content container - mobile optimized */
    .redirect-container {
      text-align: center;
      position: relative;
      z-index: 10;
      padding: clamp(1.5rem, 5vw, 3rem);
      background: rgba(10,10,20,0.7);
      border-radius: var(--radius);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      max-width: 90vw;
      width: 100%;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4), 
                 0 0 0 1px rgba(0, 247, 255, 0.1);
      margin: 0 auto;
      transform: translateY(0);
      transition: var(--transition);
    }

    .redirect-container:hover {
      box-shadow: 0 20px 40px rgba(0,0,0,0.5), 
                  0 0 0 1px rgba(0, 247, 255, 0.2);
      transform: translateY(-5px);
    }

    /* Enhanced glitch effect - mobile optimized */
    .glitch-container {
      position: relative;
      display: inline-block;
      margin: 0 auto clamp(1.5rem, 4vw, 2rem);
    }
    
    h1 {
      font-family: var(--font-main);
      font-size: clamp(1.8rem, 8vw, 3.5rem);
      font-weight: 900;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 50%, var(--secondary) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 20px rgba(0, 247, 255, 0.25);
      position: relative;
      margin: 0;
      letter-spacing: 1px;
      animation: glitch-skew 4s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite;
    }
    
    h1::before,
    h1::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 50%, var(--secondary) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      opacity: 0.8;
    }
    
    h1::before {
      animation: glitch-anim 5s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite alternate-reverse;
      left: 2px;
      clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%);
      opacity: 0.7;
    }
    
    h1::after {
      animation: glitch-anim2 4s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite alternate-reverse;
      left: -2px;
      clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%);
      opacity: 0.7;
    }
    
    @keyframes glitch-anim {
      0% { transform: translate(0); }
      20% { transform: translate(-2px, 2px); }
      40% { transform: translate(-2px, -2px); }
      60% { transform: translate(2px, 2px); }
      80% { transform: translate(2px, -2px); }
      100% { transform: translate(0); }
    }
    
    @keyframes glitch-anim2 {
      0% { transform: translate(0); }
      20% { transform: translate(2px, -2px); }
      40% { transform: translate(2px, 2px); }
      60% { transform: translate(-2px, -2px); }
      80% { transform: translate(-2px, 2px); }
      100% { transform: translate(0); }
    }
    
    @keyframes glitch-skew {
      0% { transform: skew(0deg); }
      5% { transform: skew(2deg); }
      10% { transform: skew(-2deg); }
      15% { transform: skew(0deg); }
      50% { transform: skew(0deg); }
      55% { transform: skew(1deg); }
      60% { transform: skew(-1deg); }
      65% { transform: skew(0deg); }
      100% { transform: skew(0deg); }
    }

    p {
      font-size: clamp(1rem, 4vw, 1.3rem);
      margin-bottom: clamp(1.5rem, 4vw, 2rem);
      opacity: 0.95;
      line-height: 1.6;
      font-weight: 400;
    }

    /* Enhanced progress bar */
    .progress-container {
      width: 100%;
      height: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: clamp(1.5rem, 4vw, 2rem);
      position: relative;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.3);
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), var(--accent), var(--secondary));
      border-radius: 4px;
      animation: progress 4s linear forwards;
      box-shadow: var(--neon-glow);
      position: relative;
      overflow: hidden;
    }
    
    .progress-bar::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      animation: shimmer 2s infinite;
    }

    @keyframes progress {
      0% { width: 0%; }
      100% { width: 100%; }
    }
    
    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    /* Enhanced link button - mobile optimized */
    .redirect-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: clamp(0.8rem, 2.5vw, 1rem) clamp(1.5rem, 4vw, 2rem);
      background: linear-gradient(135deg, rgba(0, 247, 255, 0.15) 0%, rgba(157, 78, 221, 0.15) 100%);
      color: var(--primary);
      border-radius: 30px;
      text-decoration: none;
      font-family: var(--font-main);
      font-size: clamp(0.9rem, 3.5vw, 1.1rem);
      font-weight: 600;
      transition: var(--transition);
      border: 1px solid rgba(0, 247, 255, 0.3);
      min-height: 50px;
      min-width: 50px;
      position: relative;
      overflow: hidden;
      letter-spacing: 0.5px;
      touch-action: manipulation; /* Improves touch responsiveness */
    }
    
    .redirect-link::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.5s;
    }
    
    .redirect-link:hover, .redirect-link:active {
      background: linear-gradient(135deg, rgba(0, 247, 255, 0.25) 0%, rgba(157, 78, 221, 0.25) 100%);
      box-shadow: var(--neon-glow), 0 5px 15px rgba(0,0,0,0.3);
      transform: translateY(-3px);
      color: var(--light);
    }
    
    .redirect-link:hover::before, .redirect-link:active::before {
      left: 100%;
    }

    /* Loading dots animation */
    .dots::after {
      content: '';
      animation: dots 1.5s steps(3, end) infinite;
    }

    @keyframes dots {
      0% { content: ''; }
      33% { content: '.'; }
      66% { content: '..'; }
      100% { content: '...'; }
    }

    /* Enhanced custom cursor - disabled on touch devices */
    .cursor, .cursor-follower{ 
      position:fixed; 
      left:0; 
      top:0; 
      pointer-events:none; 
      z-index:9999; 
      transform:translate(-50%,-50%); 
      transition:transform .08s linear; 
      mix-blend-mode: difference; 
    }
    @media (hover: hover) and (pointer: fine) {
      .cursor{ 
        width:16px; 
        height:16px; 
        border-radius:50%; 
        background: rgba(0,247,255,0.9); 
        box-shadow:0 0 12px rgba(0,247,255,0.9); 
        transition: transform 0.1s, width 0.3s, height 0.3s;
      }
      .cursor-follower{ 
        width:36px; 
        height:36px; 
        border-radius:50%; 
        border:1px solid rgba(0,247,255,0.5); 
        transition: transform 0.15s, width 0.3s, height 0.3s;
      }
    }
    @media (hover: none) {
      .cursor, .cursor-follower { display: none; }
    }

    /* Logo/brand element - mobile optimized */
    .brand {
      position: absolute;
      top: 1.5rem;
      left: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-main);
      font-weight: 700;
      font-size: 1.2rem;
      color: var(--primary);
      text-shadow: 0 0 10px rgba(0, 247, 255, 0.5);
      z-index: 20;
    }

    /* Mobile-specific optimizations */
    @media (max-width: 768px) {
      body {
        padding: 0.8rem;
        justify-content: flex-start;
        padding-top: min(15vh, 5rem);
      }
      
      .redirect-container {
        padding: clamp(1.5rem, 4vw, 2rem);
        max-width: 95vw;
      }
      
      .floating-icon {
        font-size: 1.2rem;
      }
      
      .brand {
        position: relative;
        top: auto;
        left: auto;
        margin-bottom: 1.5rem;
        font-size: 1.1rem;
      }
      
      /* Reduce animation intensity on mobile */
      h1::before, h1::after {
        opacity: 0.5;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 0.5rem;
        padding-top: min(10vh, 4rem);
      }
      
      .redirect-container {
        padding: 1.5rem;
        max-width: 98vw;
      }
      
      .redirect-link {
        width: 100%;
        max-width: 280px;
        padding: 1rem 1.5rem;
      }
      
      .floating-icon {
        font-size: 1rem;
        opacity: 0.06; /* Reduce opacity for better performance */
      }
      
      .brand {
        font-size: 1rem;
        margin-bottom: 1rem;
      }
      
      /* Further reduce animations on very small screens */
      .grid-lines {
        animation-duration: 30s;
      }
      
      .pulse-bg {
        animation-duration: 12s;
      }
    }

    /* Orientation adjustment for mobile */
    @media (max-height: 500px) and (orientation: landscape) {
      body {
        padding-top: 1rem;
        padding-bottom: 1rem;
        justify-content: flex-start;
        min-height: auto;
      }
      
      .redirect-container {
        padding: 1.5rem;
        max-width: 90%;
      }
      
      h1 {
        font-size: clamp(1.8rem, 6vw, 2.5rem);
        margin-bottom: 1rem;
      }
      
      p {
        margin-bottom: 1rem;
        font-size: 1rem;
      }
      
      .brand {
        position: relative;
        top: auto;
        left: auto;
        margin-bottom: 1rem;
      }
      
      .floating-icons {
        display: none; /* Hide floating icons in landscape to reduce clutter */
      }
    }

    /* Very small devices */
    @media (max-width: 320px) {
      .redirect-container {
        padding: 1.2rem;
      }
      
      h1 {
        font-size: 1.6rem;
      }
      
      .redirect-link {
        padding: 0.9rem 1.2rem;
        font-size: 0.9rem;
      }
      
      p {
        font-size: 0.95rem;
      }
    }

    /* High resolution displays */
    @media (min-resolution: 192dpi) {
      .grid-lines {
        background-size: 2rem 2rem;
      }
    }

    /* Reduced motion support */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      
      .progress-bar {
        animation: none;
        width: 100%;
      }
      
      .floating-icon {
        animation: none;
        opacity: 0.05;
      }
      
      .grid-lines {
        animation: none;
      }
      
      .pulse-bg {
        animation: none;
      }
      
      h1::before, h1::after {
        display: none;
      }
    }

    /* Touch device optimizations */
    @media (hover: none) {
      .redirect-link:hover {
        transform: none;
        box-shadow: none;
      }
      
      .redirect-container:hover {
        transform: none;
        box-shadow: 0 15px 35px rgba(0,0,0,0.4), 
                    0 0 0 1px rgba(0, 247, 255, 0.1);
      }
    }
  </style>

  <script>
    // Mobile detection and optimization
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    
    setTimeout(() => {
      document.body.classList.add('fade-out');
    }, 3500); // fade starts slightly before redirect

    // Initialize custom cursor for devices that support it
    document.addEventListener('DOMContentLoaded', function() {
      // Only initialize custom cursor on devices that support hover
      if (window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
        const cursor = document.querySelector('.cursor');
        const follower = document.querySelector('.cursor-follower');
        let mouseX = window.innerWidth/2, mouseY = window.innerHeight/2;
        let posX = mouseX, posY = mouseY;

        document.addEventListener('mousemove', (e) => {
          mouseX = e.clientX;
          mouseY = e.clientY;
          // direct set for the small cursor for snappy feel
          cursor.style.transform = `translate3d(${mouseX}px, ${mouseY}px, 0)`;
        });

        // follower lags behind
        function animateFollower(){
          posX += (mouseX - posX) * 0.12;
          posY += (mouseY - posY) * 0.12;
          follower.style.transform = `translate3d(${posX}px, ${posY}px, 0)`;
          requestAnimationFrame(animateFollower);
        }
        requestAnimationFrame(animateFollower);

        // change cursor on interactive elements
        const interactive = 'a, button, .redirect-link';
        document.querySelectorAll(interactive).forEach(el=>{
          el.addEventListener('mouseenter', () => {
            cursor.style.width = '12px';
            cursor.style.height = '12px';
            follower.style.width = '45px';
            follower.style.height = '45px';
          });
          el.addEventListener('mouseleave', () => {
            cursor.style.width = '16px';
            cursor.style.height = '16px';
            follower.style.width = '36px';
            follower.style.height = '36px';
          });
        });
      }
      
      // Floating icon animation tweak (add different durations)
      document.querySelectorAll('.floating-icon').forEach((el, idx) => {
        const base = 12 + (idx % 3) * 3;
        el.style.animationDuration = `${base}s`;
        el.style.opacity = isMobile ? '0.06' : '0.08';
      });
      
      // Mobile-specific optimizations
      if (isMobile) {
        // Reduce animation intensity on mobile
        document.querySelectorAll('.floating-icon').forEach(el => {
          el.style.animationDuration = '20s';
        });
        
        // Adjust grid animation for better performance
        document.querySelector('.grid-lines').style.animationDuration = '30s';
      }
    });
  </script>
</head>
<body>
  <!-- Custom cursor elements - hidden on touch devices -->
  <div class="cursor" aria-hidden="true"></div>
  <div class="cursor-follower" aria-hidden="true"></div>

  <!-- Background elements to match portfolio -->
  <div class="grid-lines" aria-hidden="true"></div>
  <div class="pulse-bg" aria-hidden="true"></div>

  <div class="floating-icons" aria-hidden="true">
    <i class="floating-icon fas fa-code" style="top:10%; left:20%; animation-delay:0s;"></i>
    <i class="floating-icon fas fa-laptop-code" style="top:30%; left:80%; animation-delay:2s;"></i>
    <i class="floating-icon fas fa-microchip" style="top:70%; left:10%; animation-delay:4s;"></i>
    <i class="floating-icon fas fa-server" style="top:50%; left:90%; animation-delay:6s;"></i>
    <i class="floating-icon fas fa-terminal" style="top:80%; left:70%; animation-delay:8s;"></i>
    <i class="floating-icon fas fa-database" style="top:20%; left:50%; animation-delay:10s;"></i>
    <i class="floating-icon fas fa-cube" style="top:60%; left:30%; animation-delay:1s;"></i>
    <i class="floating-icon fas fa-network-wired" style="top:40%; left:60%; animation-delay:7s;"></i>
  </div>

  <!-- Brand element -->
  <div class="brand">
    <span>Farooq Anwar</span>
  </div>

  <div class="redirect-container">
    <div class="glitch-container">
      <h1 data-text="Redirecting">Redirecting<span class="dots"></span></h1>
    </div>
    
    <div class="progress-container">
      <div class="progress-bar"></div>
    </div>
    
    <p>Taking you to my digital portfolio<br />Please wait a moment...</p>
    
    <a href="https://kingfarooq.github.io/portfolio/" class="redirect-link">
      <i class="fas fa-external-link-alt"></i> Click here if not redirected
    </a>
  </div>
</body>
</html>
